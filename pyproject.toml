[project]
name = "moodplay"
version = "0.1.0"
description = "Describe a mood in plain language, get music that fits: tag + embedding search, audio and kNN tag models, implicit ALS personalization."
authors = [
    { name = "Nikos Sidiropoulos", email = "nicksidiropoulos56@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "numpy>=2.5.5",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.1",
    "pyspark>=4.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "zstandard>=0.25.0",
]

[project.scripts]
moodplay = "moodplay:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# CPU-only torch on every OS: MiniLM embeddings don't need a GPU, and this avoids ~3 GB of CUDA wheels on Linux.
# Delete these two tables (and run `uv lock`) if you want the default CUDA build on a Linux GPU box.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
