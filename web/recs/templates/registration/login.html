{% extends "recs/base.html" %}
{% block title %}Log in · Music Vibe{% endblock %}
{% block content %}
<div class="authbox">
  <h1 class="pagetitle">Log in</h1>
  {% if form.errors %}<p class="error">Wrong username or password.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Username <input type="text" name="username" autofocus required></label>
    <label>Password <input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn wide" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
